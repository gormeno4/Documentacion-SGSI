definedIn: funciones_sgsi.sql:18990-19143
status: CONFIRMED
calls:
  - FN-V2-GROUP-RISK-TREATMENT-GET-LIST
tables:
  - { table: sgsi.asset_group_threat_risk, access: WRITE }
  - { table: sgsi.group_risk_treatment, access: WRITE }
  - { table: sgsi.group_risk_treatment_control, access: WRITE }
