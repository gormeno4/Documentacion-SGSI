id: FN-DASH-RELATIONS-BY-CUSTOMER
type: db-function
schema: sgsi
name: v2_relations_get_all_by_customer_id
signature: "v2_relations_get_all_by_customer_id(p_customer_id uuid, p_person_id uuid) RETURNS json"
definedIn: api-sgsi/sql/sgsi/database/sgsi/functions/v2_relations_get_all_by_customer_id.sql
status: CONFIRMED
description: "Agregación de relaciones de amenazas → vulnerabilidades → escenarios → riesgos → controles para todos los activos del cliente"

parameters:
  - name: p_customer_id
    type: uuid
    description: "Customer identifier (tenant)"
  - name: p_person_id
    type: uuid
    description: "Person identifier (user for authorization)"

returns:
  type: json
  description: "Array of RelationData objects (one per asset with relations) containing threat-vulnerability-scenario-risk-control chain for each asset"

tables:
  - table: sgsi.asset
    access: READ
    operations: "Reads all assets for customer"
  - table: sgsi.asset_group
    access: READ
    operations: "Reads asset group names"
  - table: sgsi.base_asset_type
    access: READ
    operations: "Reads asset type names"
  - table: sgsi.asset_threat_risk
    access: READ
    operations: "Reads threat-vulnerability relationships (active only)"
  - table: sgsi.asset_threat_risk_evaluation
    access: READ
    operations: "Reads probability/impact evaluations"
  - table: sgsi.ai_asset_risk_suggestions
    access: READ
    operations: "Reads AI-suggested risks and scenarios"
  - table: sgsi.ai_asset_risk_control_suggestions
    access: READ
    operations: "Reads suggested controls"
  - table: sgsi.base_control_clauses
    access: READ
    operations: "Reads control code, title, column order"
  - table: sgsi.cia_level
    access: READ
    operations: "Reads CIA level values"
  - table: sgsi.probability_impact_level
    access: READ
    operations: "Reads probability/impact level values"
  - table: sgsi.risk_treatment
    access: READ
    operations: "Checks treatment existence and reads strategy"
  - table: sgsi.risk_treatment_control
    access: READ
    operations: "Reads control-treatment mappings"

businessRules:
  - "Returns empty array if customer has no assets"
  - "One RelationData object per asset (includes empty arrays if no threats)"
  - "Threat-vulnerability-scenario-risk-control chain is fully traversed for each asset"
  - "Controls marked 'implemented' based on risk_treatment existence"
  - "Only includes active threat risks (is_active = true)"

convergences:
  - domain: DOM-ACT
    reason: "All assets, asset groups, base asset types for customer"
  - domain: DOM-RSK
    reason: "All threat risks, evaluations, AI-suggested risks, control suggestions"
  - domain: DOM-SOA
    reason: "Base control clauses for all risk treatments"

notes: |
  This function aggregates relations for ALL assets in customer.
  Used by dashboard's RelationsMap component to render network visualization of threats/vulnerabilities across the entire organization.
  Called on every dashboard render alongside getDashboardByCustomerId.

  SCOPE: Full customer, no filtering.

  No mutations, no state changes. Safe to call multiple times (idempotent).

security:
  - type: parameter
    requirement: "Both p_customer_id and p_person_id must not be NULL"
