notes: >
  Overload de 4 argumentos (uuid, uuid, uuid, uuid) - el unico invocado desde el modelo. Baja
  tenant-aware: NO borra la persona global (corvus.person queda intacta), solo sus vinculos con el
  cliente actual. Revoca TODOS los roles del par (user, customer) sin filtrar por application_id,
  incluida la fila Admin app-agnostica. Existe un overload muerto de 3 argumentos en
  funciones_corvus.sql:23927-23968 que ademas NO valida dependencias (ver Hallazgos).
