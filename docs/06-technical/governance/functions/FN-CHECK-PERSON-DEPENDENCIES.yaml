notes: >
  Devuelve NULL si la persona no tiene dependencias, o un jsonb con conteos y nombres de: pasos de
  flujo documental, activos donde es propietaria/administradora, capacitaciones, versiones de
  documento como editora, revisiones de recursos, Alta Direccion y Responsable del SGSI.

  HALLAZGO DE SEGURIDAD (tenant isolation, no corregido): la funcion solo recibe p_person_id, sin
  customer_id, y el controller tampoco valida (controllers/person.ts:688-704) - a diferencia de
  /area/dependencies y /position/dependencies, que si lo hacen. Permite enumerar dependencias de
  una persona de otro cliente.
