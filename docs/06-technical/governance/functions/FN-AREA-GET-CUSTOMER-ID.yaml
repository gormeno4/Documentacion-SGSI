notes: >
  Helper de ownership: retorna el company_id de un area. Sin endpoint propio - la invoca el
  controller (controllers/area.ts:61 y :88) como segunda query para verificar que el area
  pertenezca al cliente autenticado antes de exponer dependencias o borrarla. Mismo patron que
  FN-DOC-FLOW-GROUP-GET-CUSTOMER-ID en DOM-DOCFLOW.
