notes: >
  Exige que la version vigente este finalizada (devuelve success:false si is_complete = false).
  Desactiva la version actual, crea la siguiente (version + 1) ya activa y editable, y COPIA todas
  las filas vigentes a la nueva version reseteando la auditoria. Si no existe ninguna version,
  crea la v1 vacia.

  HALLAZGO (divergencia funcional, no corregida): no consulta si la version vigente tiene un
  proceso Doc-Flow abierto antes de desactivarla.
