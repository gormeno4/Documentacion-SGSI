id: FN-CHECK-AREA-DEPENDENCIES
type: db-function
name: corvus.check_area_dependencies
definedIn: funciones_corvus.sql:8903-8960
status: CONFIRMED
tables:
  - { table: sgsi.asset, access: READ }
  - { table: corvus.person, access: READ }
  - { table: sgsi.doc_documents, access: READ }
  - { table: sgsi.position, access: READ }
notes: >
  Devuelve NULL si no hay dependencias, o un jsonb con conteos y hasta 5 nombres por tipo.

  DIVERGENCIA FUNCIONAL ACTIVA (no corregida, fuera del alcance de la documentacion): el conteo de
  personas usa corvus.person.area_id, columna que la migracion sprint5
  (2_2026-09-07_cargo_persona_functions.sql) dejo de escribir - corvus.v2_person_upsert ya no la
  actualiza y el area por empresa vive ahora en corvus.customer_person.area_id. El backfill
  (sprint5/1) copio los valores HACIA customer_person, dejando person.area_id congelado en su
  valor pre-migracion. Consecuencia: para toda persona creada o reasignada despues de sprint5 el
  chequeo NO la cuenta, y v2_area_delete_by_id puede permitir eliminar un area que si tiene
  personas asignadas (el bloqueo solo falla si ademas el area no tiene activos, documentos ni
  cargos, que si se cuentan correctamente). Ademas, esta funcion se romperia cuando se ejecute el
  DROP COLUMN pendiente de sprint5/3_2026-09-07_drops_columnas_obsoletas.sql.
