notes: >
  Core table-returning function. UNION of 6 query sets: (1) APPROVER PENDIENTE,
  (2) PUBLISHER PENDIENTE, (3) EDITOR PENDIENTE, (4) APPROVER REVISION,
  (5) EDITOR REVISION, (6) APPROVER HISTORIAL. Polymorphic entity_type support:
  DOCUMENT, STAKEHOLDER, SCOPE, KPI, STRATEGIC_OBJECTIVE, PESTEL, FODA, EXECUTIVE_SUMMARY,
  COMMUNICATIONS_MATRIX, ACTIVO_INFORMACION, CARGO, INITIATIVE, SOA, ORGANIGRAMA,
  RISK_TREATMENT_PLAN. No mutations. Called by FN-INBOX-GET-MAIN and FN-INBOX-GET-ENRICHED.
