notes: >
  Lista los escenarios de riesgo por grupo que ya tienen un tratamiento definido, con
  sus controles vinculados. Llama sgsi.v2_asset_group_threat_risk_get_scenarios
  (FN-V2-ASSET-GROUP-THREAT-RISK-GET-SCENARIOS), function propia de DOM-RSK, documentada
  en docs/06-technical/risks/functions/ — arista cross-domain intencional, no oculta:
  esta Operación pertenece funcionalmente a DOM-SOA pero depende de datos vivos de
  Riesgos (ver externalDependencies de FLOW-SOA-006).
