notes: >
  Variante de 3 argumentos (p_group_risk_treatment_id, p_id_base_control_clause,
  p_customer_id) — la única alcanzable desde el frontend. Borra el vínculo validando
  pertenencia del tratamiento al cliente vía DELETE ... USING ... AND grt.customer_id =
  p_customer_id, a diferencia del hallazgo de seguridad de
  FN-V2-CONTROL-SOA-EVIDENCE-DELETE, aquí sí hay aislamiento de tenant. Existe un
  overload de 2 argumentos (sin p_customer_id, funciones_sgsi.sql:18660-18679) que NO se
  documenta como nodo — inalcanzable desde el frontend actual (overload muerto).
