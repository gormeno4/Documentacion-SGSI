notes: >
  CONSIDERACIÓN TÉCNICA — GET con side-effect: función de "obtener" invocada
  internamente por casi todas las demás functions de este módulo, pero si el cliente no
  tiene ninguna Declaración activa, la crea (INSERT de auto-siembra, versión 1) como
  parte de la misma llamada. Se alcanza también desde endpoints HTTP GET (p.ej.
  GET /soa/getAllControls), por lo que un simple GET puede mutar la base de datos.
  Comportamiento real del sistema, no corregido.
