notes: >
  Busca si ya existe un documento "Inventario de Activos" (content_json.sourceType =
  'ASSET_INVENTORY') para el cliente, para decidir upsert (nueva versión) vs. insert
  (documento nuevo). Invocada desde
  models/doc-documents.ts#upsertPublishedAssetInventoryDocument, a su vez invocada
  desde controllers/doc-flow.ts#handlePublishProcess cuando entity_type =
  'ASSET_INVENTORY' — ver FLOW-DOCFLOW-006 (generación automática cross-domain).
