notes: >
  Helper de aislamiento de tenant para el motor polimórfico: dado (entity_type,
  entity_id, customer_id), resuelve contra la tabla física correspondiente a ese
  entity_type. Para KPI_TRACKING y RISK_MATRIX (sin tabla propia, entity_id sintético)
  retorna true siempre — el aislamiento real para esos dos tipos depende de que Node
  (submitProcess) fuerce el customer_id en el snapshot. Llamada internamente por
  FN-DOC-FLOW-CREATE-PROCESS (5-arg) y FN-DOC-FLOW-REASSIGN-STEP (3-arg); también
  invocada directo desde Node (models/doc-flow.ts#submitProcess).
