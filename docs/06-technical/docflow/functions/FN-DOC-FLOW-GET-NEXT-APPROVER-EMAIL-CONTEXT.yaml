notes: >
  Helper de contexto para email (asunto/nombre de entidad, próximo aprobador),
  invocado desde el controller (no desde otra function SQL) en submit/approve/reassign
  para disparar la notificación fire-and-forget al siguiente aprobador
  (utils/doc-flow-email-templates.ts + utils/api.ts#sendTemplateEmail — dependencia
  externa `email`). Patrón de "función de contexto llamada desde TS" repetido en las
  otras 3 functions *_email_context de este módulo.
