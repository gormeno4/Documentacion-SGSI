notes: >
  CORRECCIÓN vs. Checkpoint A/B: se había estimado como ORPHAN (sin invocador
  confirmado en TypeScript). En Implementación se confirmó que SÍ está viva —
  invocada internamente vía LATERAL JOIN por otras tres functions de este mismo
  módulo: FN-DOC-GET-MY-DOCUMENTS, FN-DOC-GET-MY-EDITING-ASSIGNMENTS y
  FN-DOC-GET-INVENTORY-REPORT (todas `LEFT JOIN LATERAL sgsi.doc_flow_get_active_process_info(...)`).
  Ningún código TypeScript la invoca directamente — es interna a la capa SQL.
